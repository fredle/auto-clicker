[package]
name = "auto_clicker"
version = "0.1.0"
edition = "2024"
description = "Click or press keys automatically at any speed, at one spot or a sequence of them."
repository = "https://github.com/fredle/auto-clicker"

[dependencies]
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
velopack = "1.2"
# Already in the build through velopack; used to send in-app feedback.
ureq = "3"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1.31"
